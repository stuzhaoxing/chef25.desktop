[package]
name = "chef25-desktop"
version = "0.2.0"
description = "A small kitchen for your SillyTavern"
authors = ["Chef25 contributors"]
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/stuzhaoxing/chef25.desktop"

[lib]
name = "chef25_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri-plugin-updater = "=2.14.1"
if-addrs = "0.15.0"
tauri-plugin-dialog = "=2.7.2"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
