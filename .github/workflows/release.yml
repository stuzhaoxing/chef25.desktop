name: Build and publish desktop preview
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Sync all validated installers to the Chef25 download server
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  runtime-archives:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: node scripts/cache-runtime-archives.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-archives
          path: artifacts/runtime-archives/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  build:
    needs: runtime-archives
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            id: darwin-universal
            bundles: dmg
            environment: desktop-macos-release
          - os: windows-2022
            id: win32-x64
            bundles: nsis
            environment: desktop-windows-release
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Add both macOS compilation targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Check macOS signing credentials before compiling
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: python3 scripts/release-macos.py --preflight
      - run: npm ci
      - run: npm run check
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: runtime-archives
          path: artifacts/runtime-archives
      - run: npm run runtime:prepare
        env:
          CHEF25_RUNTIME_ARCHIVES: ${{ github.workspace }}/artifacts/runtime-archives
      - run: npm run runtime:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked bundled_runtime_lifecycle -- --ignored --nocapture
      - name: Verify both Node runtime architectures
        if: runner.os == 'macOS'
        run: |
          arch -arm64 src-tauri/resources/runtime/node --version
          arch -x86_64 src-tauri/resources/runtime/node --version
      - name: Build macOS Universal installer
        if: runner.os == 'macOS'
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Sign and notarize macOS app, updater and DMG
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/release-macos.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles nsis
      - name: Verify installer container
        if: runner.os == 'macOS'
        run: |
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          hdiutil verify "${dmg[0]}"
          mountpoint=$(mktemp -d)
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true; rmdir "$mountpoint" 2>/dev/null || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "${dmg[0]}"
          lipo "$mountpoint/25小厨.app/Contents/MacOS/chef25-desktop" -verify_arch arm64 x86_64
          lipo "$mountpoint/25小厨.app/Contents/Resources/runtime/node" -verify_arch arm64 x86_64
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer" }
          $destination = Join-Path $env:RUNNER_TEMP 'Chef25Smoke'
          $install = Start-Process $installer.FullName -ArgumentList "/S", "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed" }
          $app = Start-Process (Join-Path $destination 'chef25-desktop.exe') -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Installed application exited early" }
          Stop-Process -Id $app.Id
          $uninstall = Start-Process (Join-Path $destination 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed" }
      - run: node scripts/collect-artifact.mjs
      - run: node scripts/check-collected-artifacts.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.id }}
          path: artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve signed app archives if later notarization or packaging fails
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-signed-updater-recovery
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/universal-apple-darwin/release/bundle/macos/signed-app-recovery.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: downloads-preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: darwin-universal
          path: artifacts/darwin-universal
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: win32-x64
          path: artifacts/win32-x64
      - run: node scripts/create-distribution.mjs
      - name: Publish verified distribution using a restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.CHEF25_DOWNLOADS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CHEF25_DOWNLOADS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.CHEF25_DOWNLOADS_HOST }}
          DEPLOY_USER: ${{ vars.CHEF25_DOWNLOADS_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] && [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$temporary/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$temporary/known_hosts"
          chmod 600 "$temporary/key"
          tar -czf - -C artifacts/distribution . | ssh -i "$temporary/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temporary/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" publish
      - name: Verify public manifest and download headers
        run: |
          curl --fail --retry 3 https://www.chef25.com/downloads/latest.json -o latest.json
          node --input-type=module -e 'import fs from "node:fs"; const actual=JSON.parse(fs.readFileSync("latest.json")); const expected=JSON.parse(fs.readFileSync("artifacts/distribution/distribution.json")); if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error("Published manifest differs");'
          node --input-type=module -e 'import fs from "node:fs"; const manifest=JSON.parse(fs.readFileSync("latest.json")); for(const item of Object.values(manifest.platforms)){const res=await fetch("https://www.chef25.com"+item.url,{method:"HEAD"}); if(!res.ok || Number(res.headers.get("content-length"))!==item.size) throw new Error("Download header mismatch");}'
          curl --fail --retry 3 https://www.chef25.com/downloads/updater.json -o updater.json
          cmp updater.json artifacts/distribution/updater.json
