name: Build and publish desktop preview
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated installers to R2 and create a GitHub pre-release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  runtime-archives:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: node scripts/cache-runtime-archives.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-archives
          path: artifacts/runtime-archives/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  build:
    needs: runtime-archives
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            id: darwin-universal
            bundles: dmg
            environment: desktop-macos-release
          - os: windows-2022
            id: win32-x64
            bundles: nsis
            environment: desktop-windows-release
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Add both macOS compilation targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Check macOS signing credentials before compiling
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: python3 scripts/release-macos.py --preflight
      - run: npm ci
      - run: npm run check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-archives
          path: artifacts/runtime-archives
      - run: npm run runtime:prepare
        env:
          CHEF25_RUNTIME_ARCHIVES: ${{ github.workspace }}/artifacts/runtime-archives
      - run: npm run runtime:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      # Port-ownership tests release and rebind ephemeral ports; serialize them.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked bundled_runtime_lifecycle -- --ignored --nocapture
      - name: Verify both Node runtime architectures
        if: runner.os == 'macOS'
        run: |
          arch -arm64 src-tauri/resources/runtime/node --version
          arch -x86_64 src-tauri/resources/runtime/node --version
      - name: Install macOS DMG layout builder
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/chef25-dmg-venv"
          "$RUNNER_TEMP/chef25-dmg-venv/bin/python" -m pip install -r scripts/requirements-dmg.txt
          echo "$RUNNER_TEMP/chef25-dmg-venv/bin" >> "$GITHUB_PATH"
      - name: Build macOS Universal installer
        if: runner.os == 'macOS'
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Sign and notarize macOS app, updater and DMG
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/release-macos.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --bundles nsis
      - name: Verify installer container
        if: runner.os == 'macOS'
        run: |
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          hdiutil verify "${dmg[0]}"
          mountpoint=$(mktemp -d)
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true; rmdir "$mountpoint" 2>/dev/null || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "${dmg[0]}"
          test -s "$mountpoint/.DS_Store"
          test -s "$mountpoint/.background.png"
          test "$(readlink "$mountpoint/Applications")" = /Applications
          lipo "$mountpoint/25小厨.app/Contents/MacOS/chef25-desktop" -verify_arch arm64 x86_64
          lipo "$mountpoint/25小厨.app/Contents/Resources/runtime/node" -verify_arch arm64 x86_64
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer" }
          $destination = Join-Path $env:RUNNER_TEMP 'Chef25Smoke'
          $install = Start-Process $installer.FullName -ArgumentList "/S", "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed" }
          $app = Start-Process (Join-Path $destination 'chef25-desktop.exe') -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Installed application exited early" }
          Stop-Process -Id $app.Id
          $uninstall = Start-Process (Join-Path $destination 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed" }
      - run: node scripts/collect-artifact.mjs
      - run: node scripts/check-collected-artifacts.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.id }}
          path: artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve signed app archives if later notarization or packaging fails
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-signed-updater-recovery
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/universal-apple-darwin/release/bundle/macos/signed-app-recovery.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: downloads-preview
    env:
      CHEF25_DOWNLOAD_ORIGIN: ${{ vars.CHEF25_DOWNLOAD_ORIGIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-universal
          path: artifacts/darwin-universal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win32-x64
          path: artifacts/win32-x64
      - run: node scripts/create-distribution.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distribution
          path: artifacts/distribution/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Install pinned R2 publishing dependencies
        run: python3 -m pip install -r deploy/requirements-r2.txt
      - name: Validate publishing regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Publish and verify immutable R2 objects, then activate manifests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHEF25_R2_BUCKET: ${{ vars.CHEF25_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 deploy/publish-r2.py artifacts/distribution --activate
      - name: Verify public manifest and download headers
        run: |
          curl --fail --retry 3 https://www.chef25.com/downloads/latest.json -o latest.json
          node --input-type=module -e 'import fs from "node:fs"; const actual=JSON.parse(fs.readFileSync("latest.json")); const expected=JSON.parse(fs.readFileSync("artifacts/distribution/distribution.json")); if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error("Published manifest differs");'
          node --input-type=module -e 'import fs from "node:fs"; const manifest=JSON.parse(fs.readFileSync("latest.json")); for(const item of Object.values(manifest.platforms)){const res=await fetch("https://www.chef25.com"+item.url,{method:"HEAD"}); if(!res.ok || Number(res.headers.get("content-length"))!==item.size) throw new Error("Download header mismatch");}'
          curl --fail --retry 3 https://www.chef25.com/downloads/updater.json -o updater.json
          cmp updater.json artifacts/distribution/updater.json
  github-release:
    needs: publish
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: artifacts/distribution
      - name: Verify distribution and prepare version release notes
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          (cd artifacts/distribution && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          manifest = json.loads(Path("artifacts/distribution/distribution.json").read_text())
          version = manifest["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "Invalid release version"
          assert version == json.loads(Path("package.json").read_text())["version"]
          assert manifest["commit"] == os.environ["RELEASE_COMMIT"], "Build commit mismatch"
          assert manifest["preview"] is True, "Expected preview distribution"
          tag = f"v{version}"
          existing = subprocess.run(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], capture_output=True, text=True)
          if existing.returncode == 0:
              assert existing.stdout.strip() == manifest["commit"], "Existing tag points to another commit"
          changelog = Path("CHANGELOG.md").read_text()
          section = re.search(rf"^## {re.escape(version)}(?:\s[^\n]*)?\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          assert section and section[1].strip(), "Missing version changelog"
          notes = "开发预览：macOS Universal 已签名并公证；Windows x64 尚无 Authenticode。真实设备验收仍需单独完成。\n\n"
          notes += section[1].strip() + f"\n\n构建提交：`{manifest['commit']}`\n"
          notes += "\n附件与官网发布使用同一份 distribution；文件校验值见 SHA256SUMS。\n"
          Path("release-notes.md").write_text(notes)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RELEASE_TAG={tag}\n")
          PY
      - name: Create GitHub pre-release with the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/distribution/* \
            --target "$GITHUB_SHA" \
            --title "25小厨 Desktop $RELEASE_TAG（开发预览）" \
            --notes-file release-notes.md \
            --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
